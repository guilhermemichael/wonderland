name: M02 Recovery Gate

on:
  push:
    branches:
      - fix/milestone-02-production-wiring
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wonderland
          POSTGRES_PASSWORD: wonderland_dev_password
          POSTGRES_DB: wonderland_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wonderland -d wonderland_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      DATABASE_URL: postgresql+psycopg://wonderland:wonderland_dev_password@127.0.0.1:5432/wonderland_test
      TEST_DATABASE_URL: postgresql+psycopg://wonderland:wonderland_dev_password@127.0.0.1:5432/wonderland_test
      APP_ENV: development
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Verify fresh Alembic migration
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic current

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Root test suite
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Backend PostgreSQL tests
        run: pytest apps/api/tests -v

      - name: Python syntax gate
        run: python -m py_compile apps/api/main.py

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: M01 regression suite against real local API
        shell: bash
        run: |
          set -euo pipefail
          (
            cd apps/api
            uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/wonderland-api.log 2>&1
          ) &
          API_PID=$!
          npm --workspace apps/web run start -- -H 127.0.0.1 -p 3000 > /tmp/wonderland-web.log 2>&1 &
          WEB_PID=$!
          cleanup() {
            kill "$API_PID" "$WEB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          npm run test:regressions

      - name: Git whitespace gate
        run: git diff --check HEAD^
