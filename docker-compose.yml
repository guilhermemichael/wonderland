services:
  postgres:
    image: postgres:16-alpine
    container_name: wonderland-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wonderland
      POSTGRES_USER: wonderland
      POSTGRES_PASSWORD: wonderland_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonderland -d wonderland"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
